<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabiat Manzarasi</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <video id="natureVideo" autoplay muted loop playsinline>
        <source src="/home/kbaxa/Desktop/w/Web dasturlash/1amaliy/16126189_3840_2160_30fps.mp4" type="video/mp4">
    </video>

    <div class="controls">
        <button id="pauseBtn" class="btn">⏸ Pauza</button>
        <a href="batafsil.html" class="btn details-btn">Batafsil</a>
    </div>

    <script>
        const video = document.getElementById('natureVideo');
        const pauseBtn = document.getElementById('pauseBtn');

        pauseBtn.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                pauseBtn.textContent = '⏸ Pauza';
            } else {
                video.pause();
                pauseBtn.textContent = '▶ Davom etish';
            }
        });
    </script>
</body>
</html>
